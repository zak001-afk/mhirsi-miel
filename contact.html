<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Get in touch with Mhirsi Miel." />

    <meta name="theme-color" content="#090b10" />

    <title>Contact - Mhirsi Miel</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Styles -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- =========================================================
       HEADER
       ========================================================= -->

    <header class="site-header">
      <div class="header-inner">
        <p class="eyebrow" data-i18n="contact.eyebrow">Get in Touch</p>

        <h1 data-i18n="contact.title">Contact Us</h1>

        <p class="intro" data-i18n="contact.intro">
          We'd love to hear from you. Reach out anytime.
        </p>
      </div>
    </header>

    <!-- =========================================================
       NAVIGATION
       ========================================================= -->

    <nav class="site-nav" aria-label="Primary navigation">
      <button
        type="button"
        class="mobile-menu-toggle"
        aria-label="Open navigation menu"
        aria-expanded="false"
      >
        <i class="fa-solid fa-bars"></i><span>Menu</span>
      </button>
      <ul>
        <li>
          <a href="index.html" data-i18n="nav.home"> Home </a>
        </li>

        <li>
          <a href="about.html" data-i18n="nav.about"> About </a>
        </li>

        <li>
          <a href="products.html" data-i18n="nav.products"> Products </a>
        </li>

        <li>
          <a href="contact.html" data-i18n="nav.contact"> Contact </a>
        </li>
      </ul>

      <!-- Language Switcher -->
      <div class="language-switcher">
        <span class="sr-only">Language</span>

        <select id="language-select" aria-hidden="true" tabindex="-1">
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="ar">العربية</option>
        </select>

        <div class="language-dropdown">
          <button
            type="button"
            class="language-trigger"
            aria-haspopup="listbox"
            aria-expanded="false"
          >
            <span class="language-current">English</span>
            <i class="fa-solid fa-chevron-down"></i>
          </button>

          <div
            class="language-menu"
            role="listbox"
            aria-label="Select language"
          >
            <button
              type="button"
              class="language-option active"
              data-lang="en"
              role="option"
              aria-selected="true"
            >
              <span class="language-name">English</span>
            </button>

            <button
              type="button"
              class="language-option"
              data-lang="fr"
              role="option"
              aria-selected="false"
            >
              <span class="language-name">Français</span>
            </button>

            <button
              type="button"
              class="language-option"
              data-lang="ar"
              role="option"
              aria-selected="false"
            >
              <span class="language-name">العربية</span>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- =========================================================
       MAIN CONTENT
       ========================================================= -->

    <main>
      <section class="section-block">
        <div class="section-inner">
          <div class="contact-grid">
            <!-- Contact Information -->
            <div class="contact-card">
              <h2 data-i18n="contact.form.title">Contact Info</h2>

              <p>
                <span data-i18n="contact.form.emailLabel"> Email: </span>

                <a href="mailto:Mhirsimiel@gmail.com"> Mhirsimiel@gmail.com </a>
              </p>

              <p>
                <span data-i18n="contact.form.phoneLabel"> Phone: </span>

                <a href="tel:+21623797050"> +216 23 797 050 </a>
              </p>
            </div>

            <!-- Contact Form -->
            <form class="contact-form" name="contact" method="POST" netlify>
              <label for="name" data-i18n="contact.form.nameLabel">
                Name
              </label>

              <input
                type="text"
                id="name"
                name="name"
                placeholder="Your name"
                data-i18n-placeholder="contact.form.namePlaceholder"
                autocomplete="name"
                required
              />

              <label for="email" data-i18n="contact.form.emailInputLabel">
                Email
              </label>

              <input
                type="email"
                id="email"
                name="email"
                placeholder="Your email"
                data-i18n-placeholder="contact.form.emailPlaceholder"
                autocomplete="email"
                required
              />

              <label for="message" data-i18n="contact.form.messageLabel">
                Message
              </label>

              <textarea
                id="message"
                name="message"
                rows="5"
                placeholder="How can we help?"
                data-i18n-placeholder="contact.form.messagePlaceholder"
                required
              ></textarea>

              <button type="submit" class="btn" data-i18n="contact.form.button">
                Send message
              </button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <!-- =========================================================
       FOOTER
       ========================================================= -->

    <footer class="site-footer">
      <p data-i18n="footer">
        © 2026 Mhirsi Miel. Crafted with care in Tunisia.
      </p>

      <div class="social-links">
        <a
          href="https://www.facebook.com/Mhirsimiel"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Facebook"
        >
          <i class="fab fa-facebook"></i>
        </a>

        <a
          href="https://www.instagram.com/mhirsimielofficiel/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram"
        >
          <i class="fab fa-instagram"></i>
        </a>
      </div>
    </footer>

    <!-- =========================================================
       JAVASCRIPT
       ========================================================= -->

    <script src="script.js"></script>
    <script>
      const translations = {
        en: {
          pageTitle: "Contact - Mhirsi Miel",
          nav: {
            home: "Home",
            about: "About",
            products: "Products",
            contact: "Contact",
          },

          contact: {
            eyebrow: "Get in Touch",
            title: "Contact Us",
            intro: "We'd love to hear from you. Reach out anytime.",

            form: {
              title: "Contact Info",
              nameLabel: "Name",
              emailLabel: "Email:",
              emailInputLabel: "Email",
              phoneLabel: "Phone:",
              messageLabel: "Message",
              namePlaceholder: "Your name",
              emailPlaceholder: "Your email",
              messagePlaceholder: "How can we help?",
              button: "Send message",
            },
          },

          footer: "© 2026 Mhirsi Miel. Crafted with care in Tunisia.",
        },

        fr: {
          pageTitle: "Contact - Mhirsi Miel",
          nav: {
            home: "Accueil",
            about: "À propos",
            products: "Produits",
            contact: "Contact",
          },

          contact: {
            eyebrow: "Entrez en contact",
            title: "Contactez-nous",
            intro:
              "Nous serions ravis de vous entendre. Contactez-nous à tout moment.",

            form: {
              title: "Informations de contact",
              nameLabel: "Nom",
              emailLabel: "Email :",
              emailInputLabel: "Email",
              phoneLabel: "Téléphone :",
              messageLabel: "Message",
              namePlaceholder: "Votre nom",
              emailPlaceholder: "Votre email",
              messagePlaceholder: "Comment pouvons-nous vous aider ?",
              button: "Envoyer",
            },
          },

          footer: "© 2026 Mhirsi Miel. Élaboré avec soin en Tunisie.",
        },

        ar: {
          pageTitle: "اتصل بنا - Mhirsi Miel",
          nav: {
            home: "الرئيسية",
            about: "حول",
            products: "المنتجات",
            contact: "اتصل بنا",
          },

          contact: {
            eyebrow: "تواصل معنا",
            title: "اتصل بنا",
            intro: "نود أن نسمع منك. تواصل معنا في أي وقت.",

            form: {
              title: "معلومات التواصل",
              nameLabel: "الاسم",
              emailLabel: "البريد الإلكتروني:",
              emailInputLabel: "البريد الإلكتروني",
              phoneLabel: "الهاتف:",
              messageLabel: "الرسالة",
              namePlaceholder: "اسمك",
              emailPlaceholder: "بريدك الإلكتروني",
              messagePlaceholder: "كيف يمكننا مساعدتك؟",
              button: "إرسال",
            },
          },

          footer: "© 2026 Mhirsi Miel. مصنوع بعناية في تونس.",
        },
      };

      /* =========================================================
       DOM ELEMENTS
       ========================================================= */

      const i18nElements = document.querySelectorAll("[data-i18n]");
      const placeholderElements = document.querySelectorAll(
        "[data-i18n-placeholder]",
      );
      const languageDropdown = document.querySelector(".language-dropdown");
      const languageTrigger = document.querySelector(".language-trigger");
      const languageCurrent = document.querySelector(".language-current");
      const languageOptions = document.querySelectorAll(".language-option");
      const languageSelect = document.getElementById("language-select");

      const languageNames = { en: "English", fr: "Français", ar: "العربية" };
      const supportedLanguages = ["en", "fr", "ar"];

      function getTranslation(language, key) {
        return key
          .split(".")
          .reduce(
            (object, property) => object?.[property],
            translations[language],
          );
      }

      function translatePage(language) {
        const safeLanguage = supportedLanguages.includes(language)
          ? language
          : "en";

        i18nElements.forEach((element) => {
          const value = getTranslation(safeLanguage, element.dataset.i18n);
          if (typeof value === "string") element.textContent = value;
        });

        placeholderElements.forEach((element) => {
          const value = getTranslation(
            safeLanguage,
            element.dataset.i18nPlaceholder,
          );
          if (typeof value === "string")
            element.setAttribute("placeholder", value);
        });

        document.documentElement.lang = safeLanguage;
        document.documentElement.dir = safeLanguage === "ar" ? "rtl" : "ltr";

        if (translations[safeLanguage]?.pageTitle) {
          document.title = translations[safeLanguage].pageTitle;
        }

        return safeLanguage;
      }

      function updateLanguageDropdown(language) {
        if (languageCurrent) {
          languageCurrent.textContent =
            languageNames[language] || languageNames.en;
        }

        languageOptions.forEach((option) => {
          const isActive = option.dataset.lang === language;
          option.classList.toggle("active", isActive);
          option.setAttribute("aria-selected", String(isActive));
        });

        if (languageSelect) languageSelect.value = language;
      }

      function closeLanguageDropdown(restoreFocus = false) {
        if (languageDropdown) languageDropdown.classList.remove("open");
        if (languageTrigger) {
          languageTrigger.setAttribute("aria-expanded", "false");
          if (restoreFocus) languageTrigger.focus();
        }
      }

      function setLanguage(language) {
        const safeLanguage = translatePage(language);
        updateLanguageDropdown(safeLanguage);

        try {
          localStorage.setItem("mhirsimiel-language", safeLanguage);
        } catch (error) {
          // Storage may be unavailable in private browsing or restricted contexts.
        }

        closeLanguageDropdown();
      }

      if (languageTrigger && languageDropdown) {
        languageTrigger.addEventListener("click", (event) => {
          event.stopPropagation();
          const isOpen = languageDropdown.classList.toggle("open");
          languageTrigger.setAttribute("aria-expanded", String(isOpen));
        });
      }

      languageOptions.forEach((option) => {
        option.addEventListener("click", () =>
          setLanguage(option.dataset.lang),
        );
      });

      document.addEventListener("click", (event) => {
        if (languageDropdown && !languageDropdown.contains(event.target)) {
          closeLanguageDropdown();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (
          event.key === "Escape" &&
          languageDropdown?.classList.contains("open")
        ) {
          closeLanguageDropdown(true);
        }
      });

      let savedLanguage = "en";
      try {
        const storedLanguage = localStorage.getItem("mhirsimiel-language");
        if (supportedLanguages.includes(storedLanguage))
          savedLanguage = storedLanguage;
      } catch (error) {
        // Fall back to English.
      }

      const initialLanguage = translatePage(savedLanguage);
      updateLanguageDropdown(initialLanguage);

      if ("IntersectionObserver" in window) {
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (!entry.isIntersecting) return;
              entry.target.classList.add("scroll-visible");
              observer.unobserve(entry.target);
            });
          },
          { threshold: 0.1, rootMargin: "0px 0px -50px 0px" },
        );

        const animatedElements = document.querySelectorAll(
          [
            ".feature-card",
            ".product-card",
            ".section-inner h2",
            ".section-inner p",
            ".about-grid > div",
            ".about-card",
            ".contact-card",
            ".contact-form",
          ].join(", "),
        );

        animatedElements.forEach((element) => {
          element.classList.add("scroll-hidden");
          observer.observe(element);
        });
      }

      window.addEventListener("load", () => {
        document
          .querySelectorAll(".page-transition")
          .forEach((element) => element.remove());
        document.body.classList.add("page-ready");
      });
    </script>
  </body>
</html>
